name: Temp Email via Browser (Guerrilla Mail)

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name'
        required: true
        default: 'temp-mail-browser'
        type: string
      timeout_minutes:
        description: 'Max wait (minutes)'
        required: false
        default: '15'
        type: string

jobs:
  temp-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Playwright & browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin ${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
            git pull origin ${{ inputs.branch_name }}
          else
            git checkout --orphan ${{ inputs.branch_name }}
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize ${{ inputs.branch_name }} branch"
            git push --set-upstream origin ${{ inputs.branch_name }}
          fi
      - name: Run Playwright script to get second email
        run: |
          cat > ./get-inbox.js << 'SCRIPT'
          const { chromium } = require('playwright');

          const TIMEOUT_SECONDS = parseInt(process.env.TIMEOUT_SECONDS || '900', 10);

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({ ignoreHTTPSErrors: true });
            const page = await context.newPage();

            await page.goto('https://www.guerrillamail.com/', { waitUntil: 'networkidle' });

            // ---- Get the temporary email address ----
            let email = '';
            try {
              await page.waitForSelector('#email-widget', { timeout: 10000 });
              email = await page.$eval('#email-widget', el => (el.value || el.textContent || '').trim());
            } catch (e) {
              const bodyText = await page.evaluate(() => document.body.innerText);
              const match = bodyText.match(/[\w.-]+@[\w.-]+\.\w+/);
              email = match ? match[0] : 'UNKNOWN';
            }
            console.log('==============================================');
            console.log('  TEMP EMAIL:', email);
            console.log('==============================================');
            console.log('Waiting for THREE emails (ignoring the welcome email)...');
            console.log('(Will wait up to ' + (TIMEOUT_SECONDS/60) + ' minutes)');

            const start = Date.now();
            let saved = false;

            while (!saved) {
              const elapsed = (Date.now() - start) / 1000;
              if (elapsed >= TIMEOUT_SECONDS) {
                console.log('❌ Timeout');
                const fs = require('fs');
                fs.mkdirSync('inbox', { recursive: true });
                fs.writeFileSync('inbox/timeout.txt', 'Timed out waiting for third email.', 'utf-8');
                break;
              }

              // UI polling
              const rows = await page.$$('tr.mail_row');
              const count = rows.length;
              console.log(`UI check at ${Math.round(elapsed)}s – ${count} email(s)`);

              if (count >= 3) {
                // We'll try to load the third email.
                // First, check if the third row has a data attribute with mail_id
                const mailId = await rows[2].$eval('[data-mail-id]', el => el.dataset.mailId).catch(() => null) ||
                               await rows[2].evaluate(el => el.getAttribute('data-mail-id') || el.getAttribute('data-id')).catch(() => null);

                console.log(`Third row mail_id: ${mailId || 'not found'}`);

                // Click the third row
                await rows[2].click();
                console.log('Clicked third row, waiting for email body to update...');

                // Wait until the welcome text is no longer visible, or a timeout
                let loaded = false;
                try {
                  await page.waitForFunction(() => {
                    const body = document.querySelector('.email_body');
                    return body && !body.innerText.includes('Dear Random User');
                  }, { timeout: 8000 });
                  loaded = true;
                } catch (e) {
                  console.log('Welcome text still present after click, attempting force reload...');
                }

                if (!loaded) {
                  // Force reload: navigate to the inbox base, wait, then re-click
                  await page.goto('https://www.guerrillamail.com/', { waitUntil: 'networkidle' });
                  await page.waitForTimeout(2000);
                  // Re-fetch rows and click the third again
                  const newRows = await page.$$('tr.mail_row');
                  if (newRows.length >= 3) {
                    await newRows[2].click();
                    await page.waitForFunction(() => {
                      const body = document.querySelector('.email_body');
                      return body && !body.innerText.includes('Dear Random User');
                    }, { timeout: 10000 }).catch(() => {});
                  }
                }

                // Now extract the email body
                const mailFrom = await page.$eval('.email_from', el => el.textContent.trim()).catch(() => 'unknown');
                const mailSubject = await page.$eval('.email_subject', el => el.textContent.trim()).catch(() => '(no subject)');
                const bodyHTML = await page.$eval('.email_body', el => el.innerHTML).catch(() => '');
                const allLinks = await page.$$eval('.email_body a', links => links.map(a => a.href));

                // Final sanity check: if the body still contains welcome text, warn but save anyway
                if (bodyHTML.includes('Dear Random User')) {
                  console.log('WARNING: Still showing welcome email – saving anyway, but check the file.');
                }

                const fs = require('fs');
                fs.mkdirSync('inbox', { recursive: true });
                const now = new Date().toISOString().replace(/[:.]/g, '-');
                const outPath = `inbox/${now}-second-cloudflare-email.txt`;
                const content = [
                  `From: ${mailFrom}`,
                  `Subject: ${mailSubject}`,
                  `Date: ${new Date().toString()}`,
                  '',
                  'HTML BODY:',
                  '--------------------------------------------------',
                  bodyHTML,
                  '',
                  'ALL LINKS FOUND:',
                  ...allLinks.map(l => `  • ${l}`),
                  ''
                ].join('\n');
                fs.writeFileSync(outPath, content, 'utf-8');
                console.log(`Email saved to ${outPath}`);
                console.log('All links:');
                allLinks.forEach(l => console.log('  ', l));
                saved = true;
                break;
              }

              await page.waitForTimeout(10000);
            }

            await browser.close();
            if (!saved) process.exit(1);
          })();
          SCRIPT

          export TIMEOUT_SECONDS=$(( ${{ inputs.timeout_minutes }} * 60 ))
          node ./get-inbox.js          
         
      - name: Commit and push email
        if: always()
        run: |
          if [ -d "inbox" ] && [ "$(ls -A inbox 2>/dev/null)" ]; then
            git add inbox/
            git commit -m "[bot] Second email on branch ${{ inputs.branch_name }}"
            git push origin ${{ inputs.branch_name }}
          else
            echo "No email files to commit."
          fi
