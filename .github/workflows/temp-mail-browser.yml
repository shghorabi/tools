name: Temp Email via Browser (Guerrilla Mail)

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name'
        required: true
        default: 'temp-mail-browser'
        type: string
      timeout_minutes:
        description: 'Max wait (minutes)'
        required: false
        default: '15'
        type: string

jobs:
  temp-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Playwright & browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin ${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
            git pull origin ${{ inputs.branch_name }}
          else
            git checkout --orphan ${{ inputs.branch_name }}
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize ${{ inputs.branch_name }} branch"
            git push --set-upstream origin ${{ inputs.branch_name }}
          fi
          
      - name: Run Playwright script to get second email
        run: |
          cat > ./get-inbox.js << 'SCRIPT'
          const { chromium } = require('playwright');

          const TIMEOUT_SECONDS = parseInt(process.env.TIMEOUT_SECONDS || '900', 10);

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({ ignoreHTTPSErrors: true });
            const page = await context.newPage();

            await page.goto('https://www.guerrillamail.com/', { waitUntil: 'networkidle' });

            // ---- Get the temporary email address ----
            let email = '';
            try {
              await page.waitForSelector('#email-widget', { timeout: 10000 });
              email = await page.$eval('#email-widget', el => {
                return (el.value || el.textContent || '').trim();
              });
            } catch (e) {
              console.log('Primary email selector failed, trying fallback...');
            }
            if (!email || !email.includes('@')) {
              const bodyText = await page.evaluate(() => document.body.innerText);
              const match = bodyText.match(/[\w.-]+@[\w.-]+\.\w+/);
              email = match ? match[0] : 'UNKNOWN';
            }
            console.log('==============================================');
            console.log('  TEMP EMAIL:', email);
            console.log('==============================================');
            console.log('Waiting for THREE emails (ignoring the welcome email)...');
            console.log('(Will wait up to ' + (TIMEOUT_SECONDS/60) + ' minutes)');

            // ---- Attempt token capture (optional, we'll fallback to UI) ----
            let sidToken = null;
            // Method: listen for network requests
            page.on('request', request => {
              const url = request.url();
              if (url.includes('/ajax.php') && url.includes('sid_token=')) {
                const match = url.match(/sid_token=([^&]+)/);
                if (match && !sidToken) {
                  sidToken = match[1];
                  console.log('🔑 Captured sid_token from network');
                }
              }
            });
            // Also try scraping scripts after a short delay
            await page.waitForTimeout(2000);
            if (!sidToken) {
              sidToken = await page.evaluate(() => {
                const scripts = document.querySelectorAll('script');
                for (let s of scripts) {
                  const text = s.textContent || s.innerText || '';
                  const m = text.match(/sid_token['"]?\s*[:=]\s*['"]([^'"]+)['"]/);
                  if (m) return m[1];
                }
                return null;
              });
            }
            // Last chance: search all HTML
            if (!sidToken) {
              const html = await page.content();
              const m = html.match(/sid_token[=:]\s*['"]([^'"]+)['"]/);
              if (m) sidToken = m[1];
            }

            if (sidToken) {
              console.log('Using API-based polling with captured token...');
              // ---- API POLLING (same as before) ----
              const start = Date.now();
              let saved = false;
              while (!saved) {
                const elapsed = (Date.now() - start) / 1000;
                if (elapsed >= TIMEOUT_SECONDS) { console.log('Timeout'); break; }
                try {
                  const list = await page.evaluate(async (token) => {
                    const resp = await fetch(`/ajax.php?f=fetch_email&sid_token=${token}`, { credentials: 'include' });
                    return resp.json();
                  }, sidToken);
                  const emails = list.list || [];
                  console.log(`Checked at ${Math.round(elapsed)}s – ${emails.length} email(s)`);
                  if (emails.length >= 3) {
                    const third = emails[2];
                    const full = await page.evaluate(async (token, mailId) => {
                      const resp = await fetch(`/ajax.php?f=fetch_email&sid_token=${token}&id=${mailId}`, { credentials: 'include' });
                      return resp.json();
                    }, sidToken, third.mail_id);
                    saveEmail(third, full);
                    saved = true;
                    break;
                  }
                } catch (e) {
                  console.log(`API error: ${e.message}`);
                }
                await page.waitForTimeout(10000);
              }
              if (saved) {
                await browser.close();
                return;
              }
              console.log('API polling failed, falling back to UI clicking...');
            } else {
              console.log('No token captured, using UI-based clicking...');
            }

            // ---- UI FALLBACK: wait for rows, click third, verify subject ----
            const start = Date.now();
            while (true) {
              const elapsed = (Date.now() - start) / 1000;
              if (elapsed >= TIMEOUT_SECONDS) {
                console.log('Timeout');
                break;
              }

              const rows = await page.$$('tr.mail_row');
              const count = rows.length;
              console.log(`UI check at ${Math.round(elapsed)}s – ${count} email(s)`);

              if (count >= 3) {
                // Get subject of the third row (index 2) to verify later
                const thirdSubject = await rows[2].$eval('.td3', el => el.textContent.trim()).catch(() => '');
                console.log(`Third email subject: "${thirdSubject}"`);

                // Click the third row
                await rows[2].click();

                // Wait for the email body to change to something containing this subject
                // (or just wait for the body to update and then verify)
                try {
                  await page.waitForFunction(
                    (expectedSubject) => {
                      const body = document.querySelector('.email_body');
                      if (!body) return false;
                      // Check if the body text or HTML contains the subject
                      return body.innerText.includes(expectedSubject) || body.innerHTML.includes(expectedSubject);
                    },
                    thirdSubject,
                    { timeout: 15000 }
                  );
                } catch (e) {
                  console.log('Timed out waiting for body to match subject, continuing anyway...');
                }

                // Now extract the email body
                const mailFrom = await page.$eval('.email_from', el => el.textContent.trim()).catch(() => 'unknown');
                const mailSubject = await page.$eval('.email_subject', el => el.textContent.trim()).catch(() => thirdSubject);
                const bodyHTML = await page.$eval('.email_body', el => el.innerHTML).catch(() => '');
                const allLinks = await page.$$eval('.email_body a', links => links.map(a => a.href));

                saveEmail({
                  mail_from: mailFrom,
                  mail_subject: mailSubject,
                }, { mail_html: bodyHTML, mail_body: '' }, allLinks);
                await browser.close();
                return;
              }

              await page.waitForTimeout(10000);
            }

            await browser.close();
            process.exit(1);

            // Helper to save email
            function saveEmail(meta, full, links = null) {
              const fs = require('fs');
              fs.mkdirSync('inbox', { recursive: true });
              const now = new Date().toISOString().replace(/[:.]/g, '-');
              const outPath = `inbox/${now}-second-cloudflare-email.txt`;
              const bodyHTML = full.mail_html || '';
              const linkRegex = /href="([^"]+)"/g;
              const allLinks = links || [];
              if (!links) {
                let m;
                while ((m = linkRegex.exec(bodyHTML)) !== null) allLinks.push(m[1]);
              }
              const content = [
                `From: ${meta.mail_from || 'unknown'}`,
                `Subject: ${meta.mail_subject || '(no subject)'}`,
                `Date: ${new Date().toString()}`,
                '',
                'HTML BODY:',
                '--------------------------------------------------',
                bodyHTML,
                '',
                'ALL LINKS FOUND:',
                ...allLinks.map(l => `  • ${l}`),
                ''
              ].join('\n');
              fs.writeFileSync(outPath, content, 'utf-8');
              console.log(`Email saved to ${outPath}`);
              console.log('All links:');
              allLinks.forEach(l => console.log('  ', l));
            }
          })();
          SCRIPT

          export TIMEOUT_SECONDS=$(( ${{ inputs.timeout_minutes }} * 60 ))
          node ./get-inbox.js
          
      - name: Commit and push email
        if: always()
        run: |
          if [ -d "inbox" ] && [ "$(ls -A inbox 2>/dev/null)" ]; then
            git add inbox/
            git commit -m "[bot] Second email on branch ${{ inputs.branch_name }}"
            git push origin ${{ inputs.branch_name }}
          else
            echo "No email files to commit."
          fi
