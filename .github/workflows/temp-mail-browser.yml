name: Temp Email via Browser (Guerrilla Mail)

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name'
        required: true
        default: 'temp-mail-browser'
        type: string
      timeout_minutes:
        description: 'Max wait (minutes)'
        required: false
        default: '15'
        type: string

jobs:
  temp-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Playwright & browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin ${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
            git pull origin ${{ inputs.branch_name }}
          else
            git checkout --orphan ${{ inputs.branch_name }}
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize ${{ inputs.branch_name }} branch"
            git push --set-upstream origin ${{ inputs.branch_name }}
          fi
          
      - name: Run Playwright script to get second email
        run: |
          cat > ./get-inbox.js << 'SCRIPT'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({ ignoreHTTPSErrors: true });
            const page = await context.newPage();

            await page.goto('https://www.guerrillamail.com/', { waitUntil: 'networkidle' });

            // ---- Get the temporary email address ----
            let email = '';
            try {
              // Try the original input field selector
              await page.waitForSelector('#email-widget', { timeout: 10000 });
              email = await page.$eval('#email-widget', el => {
                // Use value for <input>, otherwise fall back to textContent
                return (el.value || el.textContent || '').trim();
              });
            } catch (e) {
              console.log('Primary email selector failed, trying fallback...');
            }

            // If still empty, extract any email-like text from the page
            if (!email || !email.includes('@')) {
              const bodyText = await page.evaluate(() => document.body.innerText);
              const match = bodyText.match(/[\w.-]+@[\w.-]+\.\w+/);
              email = match ? match[0] : 'UNKNOWN';
            }
            console.log('==============================================');
            console.log('  TEMP EMAIL:', email);
            console.log('==============================================');
            console.log('Waiting for TWO emails (only the 2nd will be saved)...');

            // Wait for at least 2 email rows
            await page.waitForFunction(() => {
              const rows = document.querySelectorAll('tr.mail_row');
              return rows.length >= 2;
            }, { polling: 5000 });

            console.log('✅ Two emails received! Opening the second one...');

            const rows = await page.$$('tr.mail_row');
            await rows[1].click();

            await page.waitForSelector('.email_body', { timeout: 10000 });

            const mailFrom = await page.$eval('.email_from', el => el.textContent.trim()).catch(() => 'unknown');
            const mailSubject = await page.$eval('.email_subject', el => el.textContent.trim()).catch(() => '(no subject)');
            const bodyHTML = await page.$eval('.email_body', el => el.innerHTML).catch(() => '');
            const allLinks = await page.$$eval('.email_body a', links => links.map(a => a.href));

            const fs = require('fs');
            fs.mkdirSync('inbox', { recursive: true });
            const now = new Date().toISOString().replace(/[:.]/g, '-');
            const outPath = `inbox/${now}-second-email.txt`;
            const content = [
              `From: ${mailFrom}`,
              `Subject: ${mailSubject}`,
              `Date: ${new Date().toString()}`,
              '',
              'HTML BODY:',
              '--------------------------------------------------',
              bodyHTML,
              '',
              'ALL LINKS FOUND:',
              ...allLinks.map(l => `  • ${l}`),
              ''
            ].join('\n');

            fs.writeFileSync(outPath, content, 'utf-8');
            console.log(`Email saved to ${outPath}`);
            console.log('All links:');
            allLinks.forEach(l => console.log('  ', l));

            await browser.close();
          })();
          SCRIPT

          node ./get-inbox.js
          
      - name: Commit and push email
        if: always()
        run: |
          if [ -d "inbox" ] && [ "$(ls -A inbox 2>/dev/null)" ]; then
            git add inbox/
            git commit -m "[bot] Second email on branch ${{ inputs.branch_name }}"
            git push origin ${{ inputs.branch_name }}
          else
            echo "No email files to commit."
          fi
