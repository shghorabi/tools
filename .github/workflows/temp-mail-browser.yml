name: Temp Email via Browser (Guerrilla Mail)

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name'
        required: true
        default: 'temp-mail-browser'
        type: string
      timeout_minutes:
        description: 'Max wait (minutes)'
        required: false
        default: '15'
        type: string

jobs:
  temp-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Playwright & browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin ${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
            git pull origin ${{ inputs.branch_name }}
          else
            git checkout --orphan ${{ inputs.branch_name }}
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize ${{ inputs.branch_name }} branch"
            git push --set-upstream origin ${{ inputs.branch_name }}
          fi
          
      - name: Run Playwright script to get second email
        run: |
          cat > ./get-inbox.js << 'SCRIPT'
          const { chromium } = require('playwright');

          const TIMEOUT_SECONDS = parseInt(process.env.TIMEOUT_SECONDS || '900', 10);

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({ ignoreHTTPSErrors: true });
            const page = await context.newPage();

            await page.goto('https://www.guerrillamail.com/', { waitUntil: 'networkidle' });

            // ---- Get the temporary email address ----
            let email = '';
            try {
              await page.waitForSelector('#email-widget', { timeout: 10000 });
              email = await page.$eval('#email-widget', el => {
                return (el.value || el.textContent || '').trim();
              });
            } catch (e) {
              console.log('Primary email selector failed, trying fallback...');
            }
            if (!email || !email.includes('@')) {
              const bodyText = await page.evaluate(() => document.body.innerText);
              const match = bodyText.match(/[\w.-]+@[\w.-]+\.\w+/);
              email = match ? match[0] : 'UNKNOWN';
            }

            // ---- Extract sid_token from page (multiple methods) ----
            let sidToken = await page.evaluate(() => {
              // Method 1: global guerrilla object
              if (typeof guerrilla !== 'undefined' && guerrilla.sid_token) {
                return guerrilla.sid_token;
              }
              // Method 2: check localStorage (unlikely but possible)
              if (localStorage.getItem('sid_token')) {
                return localStorage.getItem('sid_token');
              }
              return null;
            });

            if (!sidToken) {
              // Method 3: scrape all script tags for sid_token assignment
              sidToken = await page.evaluate(() => {
                const scripts = document.querySelectorAll('script');
                for (let s of scripts) {
                  const text = s.textContent || s.innerText || '';
                  const match = text.match(/sid_token\s*[:=]\s*['"]([^'"]+)['"]/);
                  if (match) return match[1];
                }
                return null;
              });
            }

            if (!sidToken) {
              // Method 4: last resort – search whole HTML for patterns
              const html = await page.content();
              const match = html.match(/sid_token[=:]\s*['"]([^'"]+)['"]/);
              if (match) sidToken = match[1];
            }

            if (!sidToken) {
              console.error('❌ Could not extract sid_token from page. Aborting.');
              process.exit(1);
            }

            console.log('==============================================');
            console.log('  TEMP EMAIL:', email);
            console.log('==============================================');
            console.log('Waiting for THREE emails (ignoring the welcome email)...');
            console.log('(Will wait up to ' + (TIMEOUT_SECONDS/60) + ' minutes)');

            const apiBase = 'https://www.guerrillamail.com/ajax.php';
            const start = Date.now();
            let emailSaved = false;

            while (true) {
              const elapsed = (Date.now() - start) / 1000;
              if (elapsed >= TIMEOUT_SECONDS) {
                console.log('❌ Timeout: fewer than 3 emails.');
                const fs = require('fs');
                fs.mkdirSync('inbox', { recursive: true });
                fs.writeFileSync('inbox/timeout.txt', 'Timed out waiting for third email.', 'utf-8');
                break;
              }

              // Fetch email list using sid_token
              let listResponse;
              try {
                listResponse = await page.evaluate(async (token) => {
                  const resp = await fetch(`/ajax.php?f=fetch_email&sid_token=${token}`, { mode: 'cors', credentials: 'include' });
                  if (!resp.ok) throw new Error('HTTP ' + resp.status);
                  const text = await resp.text();
                  try {
                    return JSON.parse(text);
                  } catch (e) {
                    throw new Error('Invalid JSON: ' + text.substring(0, 200));
                  }
                }, sidToken);
              } catch (err) {
                console.log(`⚠️ API error: ${err.message}. Retrying...`);
                await page.waitForTimeout(10000);
                continue;
              }

              const emailList = listResponse.list || [];
              const count = emailList.length;
              console.log(`Checked at ${Math.round(elapsed)}s – ${count} email(s) found.`);

              if (count >= 3) {
                console.log('✅ Three emails received! Fetching the third one...');
                const thirdEmail = emailList[2]; // index 2 = third email

                // Fetch full email
                let fullEmail;
                try {
                  fullEmail = await page.evaluate(async (token, mailId) => {
                    const resp = await fetch(`/ajax.php?f=fetch_email&sid_token=${token}&id=${mailId}`, { mode: 'cors', credentials: 'include' });
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const text = await resp.text();
                    try {
                      return JSON.parse(text);
                    } catch (e) {
                      throw new Error('Invalid JSON: ' + text.substring(0, 200));
                    }
                  }, sidToken, thirdEmail.mail_id);
                } catch (err) {
                  console.error(`Failed to fetch email content: ${err.message}`);
                  break;
                }

                const mailFrom = thirdEmail.mail_from || 'unknown';
                const mailSubject = thirdEmail.mail_subject || '(no subject)';
                const bodyHTML = fullEmail.mail_html || '';
                const bodyText = fullEmail.mail_body || '';

                // Extract all links from HTML body
                const linkRegex = /href="([^"]+)"/g;
                const allLinks = [];
                let match;
                while ((match = linkRegex.exec(bodyHTML)) !== null) {
                  allLinks.push(match[1]);
                }

                const fs = require('fs');
                fs.mkdirSync('inbox', { recursive: true });
                const now = new Date().toISOString().replace(/[:.]/g, '-');
                const outPath = `inbox/${now}-second-cloudflare-email.txt`;
                const content = [
                  `From: ${mailFrom}`,
                  `Subject: ${mailSubject}`,
                  `Date: ${new Date().toString()}`,
                  '',
                  'HTML BODY:',
                  '--------------------------------------------------',
                  bodyHTML,
                  '',
                  'ALL LINKS FOUND:',
                  ...allLinks.map(l => `  • ${l}`),
                  ''
                ].join('\n');
                fs.writeFileSync(outPath, content, 'utf-8');
                console.log(`Email saved to ${outPath}`);
                console.log('All links:');
                allLinks.forEach(l => console.log('  ', l));
                emailSaved = true;
                break;
              }

              await page.waitForTimeout(10000);
            }

            await browser.close();
            if (!emailSaved) {
              process.exit(1);
            }
          })();
          SCRIPT

          export TIMEOUT_SECONDS=$(( ${{ inputs.timeout_minutes }} * 60 ))
          node ./get-inbox.js
          
      - name: Commit and push email
        if: always()
        run: |
          if [ -d "inbox" ] && [ "$(ls -A inbox 2>/dev/null)" ]; then
            git add inbox/
            git commit -m "[bot] Second email on branch ${{ inputs.branch_name }}"
            git push origin ${{ inputs.branch_name }}
          else
            echo "No email files to commit."
          fi
