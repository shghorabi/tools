name: Temp Email via Browser (Guerrilla Mail)

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name'
        required: true
        default: 'temp-mail-browser'
        type: string
      timeout_minutes:
        description: 'Max wait (minutes)'
        required: false
        default: '15'
        type: string

jobs:
  temp-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Playwright & browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin ${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
            git pull origin ${{ inputs.branch_name }}
          else
            git checkout --orphan ${{ inputs.branch_name }}
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize ${{ inputs.branch_name }} branch"
            git push --set-upstream origin ${{ inputs.branch_name }}
          fi
          
      - name: Run Playwright script to get second email
        run: |
          cat > ./get-inbox.js << 'SCRIPT'
          const { chromium } = require('playwright');

          const TIMEOUT_SECONDS = parseInt(process.env.TIMEOUT_SECONDS || '900', 10);

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({ ignoreHTTPSErrors: true });
            const page = await context.newPage();

            await page.goto('https://www.guerrillamail.com/', { waitUntil: 'networkidle' });

            // ---- Get the temporary email address ----
            let email = '';
            try {
              await page.waitForSelector('#email-widget', { timeout: 10000 });
              email = await page.$eval('#email-widget', el => (el.value || el.textContent || '').trim());
            } catch (e) {
              const bodyText = await page.evaluate(() => document.body.innerText);
              const match = bodyText.match(/[\w.-]+@[\w.-]+\.\w+/);
              email = match ? match[0] : 'UNKNOWN';
            }
            console.log('==============================================');
            console.log('  TEMP EMAIL:', email);
            console.log('==============================================');
            console.log('Waiting for THREE emails (ignoring the welcome email)...');
            console.log('(Will wait up to ' + (TIMEOUT_SECONDS/60) + ' minutes)');

            // Try capturing sid_token for a quick API attempt
            let sidToken = null;
            page.on('request', req => {
              const url = req.url();
              if (url.includes('/ajax.php') && url.includes('sid_token=')) {
                const m = url.match(/sid_token=([^&]+)/);
                if (m && !sidToken) sidToken = m[1];
              }
            });
            await page.waitForTimeout(2000);

            // Quick API test – if it works, use it; otherwise go to UI
            let useUI = true;
            if (sidToken) {
              try {
                const test = await page.evaluate(async (token) => {
                  const resp = await fetch(`/ajax.php?f=fetch_email&sid_token=${token}`, { credentials: 'include' });
                  return resp.json();
                }, sidToken);
                if (test && test.list) {
                  console.log('API working – using it for polling.');
                  useUI = false;
                }
              } catch (e) {
                console.log('API unavailable, falling back to UI polling.');
              }
            } else {
              console.log('No token, using UI polling.');
            }

            const start = Date.now();
            let saved = false;

            // POLLING LOOP
            while (!saved) {
              const elapsed = (Date.now() - start) / 1000;
              if (elapsed >= TIMEOUT_SECONDS) {
                console.log('❌ Timeout');
                const fs = require('fs');
                fs.mkdirSync('inbox', { recursive: true });
                fs.writeFileSync('inbox/timeout.txt', 'Timed out waiting for third email.', 'utf-8');
                break;
              }

              let rowCount = 0;
              if (!useUI) {
                // API polling
                try {
                  const list = await page.evaluate(async (token) => {
                    const resp = await fetch(`/ajax.php?f=fetch_email&sid_token=${token}`, { credentials: 'include' });
                    return resp.json();
                  }, sidToken);
                  rowCount = (list.list || []).length;
                  if (rowCount >= 3) {
                    const third = list.list[2];
                    const full = await page.evaluate(async (token, mailId) => {
                      const resp = await fetch(`/ajax.php?f=fetch_email&sid_token=${token}&id=${mailId}`, { credentials: 'include' });
                      return resp.json();
                    }, sidToken, third.mail_id);
                    saveEmail(third, full);
                    saved = true;
                    break;
                  }
                } catch (e) {
                  console.log(`API error, switching to UI…`);
                  useUI = true; // fallback on next loop
                }
              }

              if (useUI) {
                // UI polling
                const rows = await page.$$('tr.mail_row');
                rowCount = rows.length;
                console.log(`UI check at ${Math.round(elapsed)}s – ${rowCount} email(s)`);

                if (rowCount >= 3) {
                  // Get subject of third row for verification
                  const thirdSubject = await rows[2].$eval('.td3', el => el.textContent.trim()).catch(() => '');
                  console.log(`Third email subject: "${thirdSubject}"`);

                  // Click third row
                  await rows[2].click();
                  // Wait for body to contain this subject (max 10s)
                  try {
                    await page.waitForFunction(
                      (expectedSubject) => {
                        const body = document.querySelector('.email_body');
                        return body && (body.innerText.includes(expectedSubject) || body.innerHTML.includes(expectedSubject));
                      },
                      thirdSubject,
                      { timeout: 10000 }
                    );
                  } catch (e) {
                    console.log('Body did not update, saving whatever is displayed…');
                  }

                  // Extract content
                  const mailFrom = await page.$eval('.email_from', el => el.textContent.trim()).catch(() => '');
                  const mailSubject = await page.$eval('.email_subject', el => el.textContent.trim()).catch(() => thirdSubject);
                  const bodyHTML = await page.$eval('.email_body', el => el.innerHTML).catch(() => '');
                  const allLinks = await page.$$eval('.email_body a', links => links.map(a => a.href));

                  saveEmail({ mail_from: mailFrom, mail_subject: mailSubject }, { mail_html: bodyHTML }, allLinks);
                  saved = true;
                  break;
                }
              }

              await page.waitForTimeout(10000);
            }

            await browser.close();
            if (!saved) process.exit(1);

            function saveEmail(meta, full, links = null) {
              const fs = require('fs');
              fs.mkdirSync('inbox', { recursive: true });
              const now = new Date().toISOString().replace(/[:.]/g, '-');
              const outPath = `inbox/${now}-second-cloudflare-email.txt`;
              const bodyHTML = full.mail_html || '';
              const allLinks = links || [];
              if (!links) {
                const linkRegex = /href="([^"]+)"/g;
                let m;
                while ((m = linkRegex.exec(bodyHTML)) !== null) allLinks.push(m[1]);
              }
              const content = [
                `From: ${meta.mail_from || 'unknown'}`,
                `Subject: ${meta.mail_subject || '(no subject)'}`,
                `Date: ${new Date().toString()}`,
                '',
                'HTML BODY:',
                '--------------------------------------------------',
                bodyHTML,
                '',
                'ALL LINKS FOUND:',
                ...allLinks.map(l => `  • ${l}`),
                ''
              ].join('\n');
              fs.writeFileSync(outPath, content, 'utf-8');
              console.log(`Email saved to ${outPath}`);
              console.log('All links:');
              allLinks.forEach(l => console.log('  ', l));
            }
          })();
          SCRIPT

          export TIMEOUT_SECONDS=$(( ${{ inputs.timeout_minutes }} * 60 ))
          node ./get-inbox.js
         
      - name: Commit and push email
        if: always()
        run: |
          if [ -d "inbox" ] && [ "$(ls -A inbox 2>/dev/null)" ]; then
            git add inbox/
            git commit -m "[bot] Second email on branch ${{ inputs.branch_name }}"
            git push origin ${{ inputs.branch_name }}
          else
            echo "No email files to commit."
          fi
