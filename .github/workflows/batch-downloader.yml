name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      quarry:
        description: ' search quarry'
        required: false
        default: ''
        type: string
      url:
        description: '🔗 Video video URL'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options: [best, 2160, 1440, 1080, 720, 480, 360, 144, audio]
      output_name:
        description: '📝 Output file name (optional, without extension)'
        required: false
        type: string
      branch_name:
        description: 'ℹ️ Branch name (simultaneous workflows cannot be on the same branch)'
        required: true
        default: 'videos'
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin ${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
            git pull origin ${{ inputs.branch_name }}
          else
            git checkout --orphan ${{ inputs.branch_name }}
            git rm -rf . || true
            mkdir -p ${{ inputs.branch_name }}
            git commit --allow-empty -m "[bot] Initialize ${{ inputs.branch_name }} branch"
            git push --set-upstream origin ${{ inputs.branch_name }}
          fi

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          # clean up any existing container/network (useful for self-hosted runners)
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          # start WARP 
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          # dynamic polling loop (up to 30 seconds max)
          WARP_READY=false
          for i in {1..10}; do
            # use 1.1.1.1 for faster trace resolution
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)=" # Print clean debug info
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
            # exit 1  <-- Uncomment this if you want the pipeline to FAIL when WARP fails
          fi

      - name: Setup package
        run: |
          pip install --upgrade pip
          pip install phub[full]
          pip install av

      - name: Download videos via API
        id: download
        run: |
          mkdir -p tmpvideos

          python3 << 'PYEOF'
          # ---------- imports ----------
          from phub import Client                 
          from base_api.modules.config import config
          from base_api.base import BaseCore

          # ---------- optional proxy (if you keep WARP) ----------
          # If you DO NOT need the WARP proxy, remove or comment out this whole block,
          # and later just use: client = Client()
          use_proxy = True   # set to False if you don't want the proxy
          if use_proxy:
              config.proxy = "socks5://127.0.0.1:1080"
              # you can set other config options here if needed, e.g.:
              # config.request_delay = 5

              # create a custom core with the proxy config
              core = BaseCore(config=config)
              # optional extra features (logging, kill‑switch) – not required
              # core.enable_logging()
              # core.enable_kill_switch()

              client = Client(core=core)
          else:
              # plain client (no custom proxy)
              client = Client()
          # ----------------------------------------

          # ---------- fetch video ----------
          search = client.search(query="${{ inputs.quarry }}",
                        sort='views'
                       )
          for video in search:
            print(video.author)
          url = "${{ inputs.url }}"
          video = client.get(url)
          video.refresh()   # refresh metadata (title, available streams)

          # ---------- quality handling ----------
          quality = "${{ inputs.quality }}"
          if quality == "audio":
              # download best video, then extract audio with ffmpeg
              quality = "best"

          print(f"Downloading: {video.title}")
          video.download(
              path="tmpvideos/",
              quality=quality,
              remux=True
              # all advanced options (max_workers_download, etc.) are left at their defaults
          )

          # ---------- audio extraction if requested ----------
          if "${{ inputs.quality }}" == "audio":
              import subprocess, os
              files = os.listdir("tmpvideos")
              if files:
                  input_file = os.path.join("tmpvideos", files[0])
                  output_file = os.path.join("tmpvideos", os.path.splitext(files[0])[0] + ".mp3")
                  subprocess.run([
                      "ffmpeg", "-i", input_file, "-vn",
                      "-acodec", "libmp3lame", "-q:a", "2",
                      output_file
                  ], check=True)
                  os.remove(input_file)
          PYEOF

          # ===== everything below is exactly as before =====
          cd tmpvideos
          FILE=$(ls -1 | head -n 1)
          FILE_NO_EXTENSION="${FILE%.*}"
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "FILE_NO_EXTENSION=$FILE_NO_EXTENSION" >> $GITHUB_ENV
          SAFE_NAME=$(echo "$FILE_NO_EXTENSION" | sed 's/^[[:space:]]*//' | tr ' ' '_')
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV

          mkdir -p ../videos
          rm -rf tmpzip
          mkdir tmpzip
          zip -r -0 -s "45m" "tmpzip/${SAFE_NAME}.zip" "."
          mv tmpzip/* ../videos/
          
      - name: Stop WARP
        run: |
          docker stop warp || true

      - name: Generate README with Download Links
        run: |
          rm -f README.md
          
          echo "# 📥 Download Links" > README.md
          echo "Generated on: $(date)" >> README.md
          echo "" >> README.md
          
          # loop through all files in the videos folder
          for file in videos/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # URL Encode spaces for the markdown link
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
              # Construct the raw link
              url="https://github.com/${{ github.repository }}/raw/${{ inputs.branch_name }}/videos/$encoded_filename"
              echo "- [Download $filename]($url)" >> README.md
            fi
          done
          
      - name: Commit and push in batches
        run: |
          # Ensure git identity is set (global config persists from earlier step, but re-set just in case)
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Commit the README first (tiny file)
          if [ -f README.md ]; then
            git add README.md
            git commit -m "[bot] Update README for ${{ env.SAFE_NAME }}" || echo "Nothing to commit for README"
            git push
          fi
          
          # Batch commit video parts
          BATCH_SIZE=5   # adjust as needed (2-3 parts = 90-135 MB per push)
          count=0
          batch_num=1
          
          for file in videos/*; do
            if [ -f "$file" ]; then
              git add "$file"
              count=$((count + 1))
              if [ $count -ge $BATCH_SIZE ]; then
                git commit -m "[bot] Add video parts batch $batch_num for ${{ env.SAFE_NAME }}"
                git push
                count=0
                batch_num=$((batch_num + 1))
              fi
            fi
          done
          
          # Push any remaining files
          if [ $count -gt 0 ]; then
            git commit -m "[bot] Add video parts batch $batch_num for ${{ env.SAFE_NAME }}"
            git push
          fi
