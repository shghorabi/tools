name: Temporary Email Inbox (Maildrop)

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name'
        required: true
        default: 'temp-mail-maildrop'
        type: string
      timeout_minutes:
        description: 'Max wait (minutes)'
        required: false
        default: '15'
        type: string

jobs:
  temp-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin ${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
            git pull origin ${{ inputs.branch_name }}
          else
            git checkout --orphan ${{ inputs.branch_name }}
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize ${{ inputs.branch_name }} branch"
            git push --set-upstream origin ${{ inputs.branch_name }}
          fi

      - name: Get temporary inbox and wait for second email
        id: inbox
        run: |
          # Generate random mailbox name (Maildrop auto-creates it)
          MAILBOX="github-$(uuidgen | tr -d '-' | head -c 10)"
          DOMAIN="maildrop.cc"
          EMAIL="${MAILBOX}@${DOMAIN}"
          API_URL="https://api.maildrop.cc/v2/inbox/${MAILBOX}"

          echo ""
          echo "=============================================="
          echo "  TEMP EMAIL: $EMAIL"
          echo "=============================================="
          echo "Waiting for TWO emails (only the 2nd will be saved)."
          echo ""

          TIMEOUT_SECONDS=$(( ${{ inputs.timeout_minutes }} * 60 ))
          START_TIME=$(date +%s)
          FIRST_SEEN=0

          while true; do
            sleep 10

            # Fetch inbox (returns { "messages": [...] })
            RESPONSE=$(curl -s --max-time 10 "${API_URL}")

            # Validate JSON
            if ! echo "$RESPONSE" | jq empty 2>/dev/null; then
              echo "API returned invalid JSON, retrying..."
              NOW=$(date +%s)
              if [ $((NOW - START_TIME)) -ge $TIMEOUT_SECONDS ]; then
                echo "Timeout while API was unresponsive."
                mkdir -p inbox
                echo "Timed out – API was unresponsive." > "inbox/$(date +%Y%m%d-%H%M%S)-timeout.txt"
                exit 1
              fi
              continue
            fi

            COUNT=$(echo "$RESPONSE" | jq '.messages | length')

            if [ "$COUNT" -ge 2 ]; then
              echo "✅ Received $COUNT emails."

              # Second message (index 1)
              SECOND=$(echo "$RESPONSE" | jq '.messages[1]')
              MAIL_ID=$(echo "$SECOND" | jq -r '.id')
              MAIL_FROM=$(echo "$SECOND" | jq -r '.from')
              MAIL_SUBJECT=$(echo "$SECOND" | jq -r '.subject')
              MAIL_BODY=$(echo "$SECOND" | jq -r '.textBody')
              MAIL_HTML=$(echo "$SECOND" | jq -r '.html // ""')

              # Extract links from HTML
              if [ -n "$MAIL_HTML" ]; then
                LINKS=$(echo "$MAIL_HTML" | grep -oP 'href="\K[^"]+' | grep -E '^https?://' || echo "No links found")
              else
                LINKS="No HTML body available."
              fi

              mkdir -p inbox
              OUTFILE="inbox/$(date +%Y%m%d-%H%M%S)-second-email.txt"
              {
                echo "From: $MAIL_FROM"
                echo "Subject: $MAIL_SUBJECT"
                echo "Date: $(date)"
                echo "--------------------------------------------------"
                echo "PLAIN TEXT BODY:"
                echo "$MAIL_BODY"
                echo ""
                echo "LINKS FOUND IN HTML:"
                echo "$LINKS"
              } > "$OUTFILE"

              echo "Email saved to $OUTFILE"
              exit 0

            elif [ "$COUNT" -eq 1 ]; then
              if [ "$FIRST_SEEN" -eq 0 ]; then
                echo "First email arrived, waiting for second..."
                FIRST_SEEN=1
              fi
            else
              echo "No emails yet..."
            fi

            NOW=$(date +%s)
            if [ $((NOW - START_TIME)) -ge $TIMEOUT_SECONDS ]; then
              echo "Timeout: Only $COUNT email(s) received."
              mkdir -p inbox
              echo "Timed out waiting for second email." > "inbox/$(date +%Y%m%d-%H%M%S)-timeout.txt"
              exit 1
            fi
          done

      - name: Commit and push (only if email was saved)
        if: always()
        run: |
          if [ -d "inbox" ] && [ "$(ls -A inbox 2>/dev/null)" ]; then
            git add inbox/
            git commit -m "[bot] Second email (Maildrop) on branch ${{ inputs.branch_name }}"
            git push origin ${{ inputs.branch_name }}
          else
            echo "No email files to commit."
          fi
