name: Search Results

on:
  workflow_dispatch:
    inputs:
      quarry:
        description: 'Search query'
        required: true
        default: ''
        type: string
      sort:
        description: 'sort by recent, views, rated, longuest'
        required: false
        default: 'views'
        type: string
      branch_name:
        description: 'Branch to store search results'
        required: true
        default: 'search-results'
        type: string

jobs:
  search-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin ${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
            git pull origin ${{ inputs.branch_name }}
          else
            git checkout --orphan ${{ inputs.branch_name }}
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize ${{ inputs.branch_name }} branch"
            git push --set-upstream origin ${{ inputs.branch_name }}
          fi

      - name: Setup FFmpeg (not strictly needed but harmless)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup WARP proxy
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP proxy to be ready..."
          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP ready (attempt $i)"
              WARP_READY=true
              break
            fi
            sleep 3
          done
          if [ "$WARP_READY" = false ]; then
            echo "WARP not ready, continuing anyway..."
          fi

      - name: Setup Python and phub
        run: |
          pip install --upgrade pip
          pip install phub[full]
          pip install av   # optional but safe

      - name: Run search and generate result files
        run: |
          python3 << 'PYEOF'
          import json
          from phub import Client
          from base_api.modules.config import config
          from base_api.base import BaseCore

          # Proxy setup (same as before)
          config.proxy = "socks5://127.0.0.1:1080"
          core = BaseCore(config=config)
          client = Client(core=core)

          query = "${{ inputs.quarry }}"
          sortby = "${{ inputs.sort }}"
          if not query.strip():
              raise ValueError("No search query provided")

          print(f"Searching for: {query}")
          search = client.search(query=query, sort=sortby)

          full_results = []   # dict from dictify('all')
          partial_results = [] # dict with only 'title', 'url'

          full_limit = 50
          partial_limit = 30

          for video in search:
              # Stop if we have enough of both types
              if len(full_results) >= full_limit and len(partial_results) >= partial_limit:
                  break

              # Try to get full dict first
              try:
                  info = video.dictify('all')
                  full_results.append(info)
                  print(f"Full result {len(full_results)}: {video.url}")
              except Exception as e:
                  # Full dictify failed – try to at least get title and url
                  try:
                      title = video.title
                      url = video.url
                      partial_results.append({
                          'title': title,
                          'url': url,
                          'partial': True,
                          'error': str(e)[:100]  # optional: include first 100 chars of error
                      })
                      print(f"Partial result {len(partial_results)} (title/url only): {url}")
                  except Exception as e2:
                      print(f"Skipping video (cannot get title/url either): {video.url if hasattr(video, 'url') else 'unknown'} - {e2}")
                  continue

          print(f"Total collected: {len(full_results)} full + {len(partial_results)} partial = {len(full_results)+len(partial_results)}")

          # Combine results: full dicts first, then partials
          all_results = full_results + partial_results

          # Write to text file
          with open('search_results.txt', 'w', encoding='utf-8') as f:
              f.write(f"Search query: {query}\n")
              f.write(f"Full results (dictify): {len(full_results)}\n")
              f.write(f"Partial results (title+url only): {len(partial_results)}\n")
              f.write(f"Total: {len(all_results)}\n\n")
              for idx, video_data in enumerate(all_results, 1):
                  f.write(f"--- Result {idx} ---\n")
                  f.write(str(video_data))
                  f.write("\n\n" + "="*80 + "\n\n")

          # Write JSON version
          with open('search_results.json', 'w', encoding='utf-8') as f:
              json.dump(all_results, f, indent=2, ensure_ascii=False)

          print("Saved search_results.txt and search_results.json")
          PYEOF

      - name: Generate README with links to results
        run: |
          cat > README.md << EOF
          # 🔍 Search Results

          | Item | Value |
          |------|-------|
          | **Query** | ${{ inputs.quarry }} |
          | **Date** | $(date -u) |
          | **Results file** | [Download search_results.txt](./search_results.txt) |
          | **JSON version** | [Download search_results.json](./search_results.json) |

          ## 📄 Preview (first 50 lines of text results)
          \`\`\`
          $(head -n 50 search_results.txt 2>/dev/null || echo "No results")
          \`\`\`
          EOF

      - name: Commit and push
        run: |
          git add README.md search_results.txt search_results.json
          git commit -m "[bot] Update search results for '${{ inputs.quarry }}'" || echo "No changes to commit"
          git push

      - name: Stop WARP (cleanup)
        run: docker stop warp || true
